<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!-- Bez maximum-scale: kierowca w słońcu musi móc rozsunąć ekran palcami.
     Pole podpisu i mapa mają własną obsługę dotyku, więc im to nie przeszkadza. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E4E4E">
<script>
/* Motyw rozstrzygamy PRZED arkuszem. Inaczej pierwszy obraz jest zawsze jasny,
   a kierowca otwierający aplikację w nocy dostaje w oczy białą kartkę.

   Bez osobnego pliku, i to nie z lenistwa: index.html serwer oddaje
   z „no-store”, więc ten kawałek NIGDY nie bywa starą kopią. Osobny motyw.js
   trzeba by dopisywać w trzech ręcznych listach (tu, ZASOBY w sw.js, PLIKI
   w smoke.js), a pominięcie tej w sw.js oznacza program, który nie wstaje
   bez zasięgu. W head byłby do tego kolejnym blokującym pobraniem.

   Ta sama reguła co Motyw.policz w app.js. Dwie kopie jednej reguły to dług —
   spina je test w smoke.js, który wykonuje ten kod i porównuje z app.js.

   Dwa osobne try/catch, bo w Safari w trybie prywatnym sam DOSTĘP do
   localStorage potrafi rzucić wyjątkiem, a wyjątek w skrypcie w head zatrzymuje
   parsowanie strony — telefon pokazałby wtedy biały ekran zamiast logowania.

   Klucz ma przedrostek „gk-trasy.” (Pamiec w app.js): na GitHub Pages
   wszystkie aplikacje GK dzielą jeden localStorage. Klucz bez przedrostka
   czytamy tylko przy pierwszym wejściu po aktualizacji i tylko poza Pages —
   tam jest cudzy (app.js zaraz go przeniesie). */
(function () {
  var wybor = null;
  try {
    wybor = localStorage.getItem('gk-trasy.motyw');
    if (wybor === null && !/(^|\.)github\.io$/i.test(String(location.hostname || ''))) {
      wybor = localStorage.getItem('motyw');
    }
  } catch (e) { /* tryb prywatny */ }
  var systemCiemny = false;
  try {
    systemCiemny = !!(window.matchMedia
      && window.matchMedia('(prefers-color-scheme: dark)').matches);
  } catch (e) { /* starsza przeglądarka */ }
  var motyw = (wybor === 'ciemny' || (wybor !== 'jasny' && systemCiemny)) ? 'ciemny' : 'jasny';
  var korzen = document.documentElement;
  korzen.setAttribute('data-motyw', motyw);
  /* Styl wpisany wprost działa od razu; ta sama deklaracja z arkusza dopiero
     po jego wczytaniu. Po wolnym łączu to widoczna różnica: pola dat, listy
     rozwijane i autouzupełnianie zdążyłyby mrugnąć bielą. */
  korzen.style.colorScheme = motyw === 'ciemny' ? 'dark' : 'light';
  var pasek = document.querySelector('meta[name=theme-color]');
  if (pasek) pasek.setAttribute('content', motyw === 'ciemny' ? '#191817' : '#4E4E4E');
})();
</script>
